# Override any value from the CLI: --set optim.batch_size=128 loss.video_weight=1.0
data:
  manifest: data/emg1/manifest.json
  window_s: 2.0
  stride_s: 0.5
  patch_ms: 50          # 40 time patches per window
  subjects: null        # list of subject ids to pretrain on; null = all. Hold out your eval subjects here.

model:
  dim: 384
  depth: 8
  heads: 6
  pred_dim: 192
  pred_depth: 4
  pred_heads: 6
  max_channels: 64

mask:
  n_blocks: 4           # 4 x 4 = 16 of 40 time patches hidden (40%)
  block_len: 4
  drop_channels: 0

loss:
  self_weight: 1.0
  video_weight: 0.0     # > 0 needs "video" latents in the manifest

optim:
  epochs: 100
  batch_size: 256
  lr: 5.0e-4
  weight_decay: 0.05
  warmup_epochs: 5
  ema_start: 0.996
  ema_end: 1.0
  num_workers: 4
  amp: true
  seed: 0

out: runs/emg1_jepa
